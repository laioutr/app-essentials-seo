name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # No `version` input on purpose: the action reads `packageManager` from package.json, so the
      # pinned pnpm lives in one place and cannot drift from the `engines.pnpm` range beside it.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # `.npmrc` is gitignored, because it carries the registry token, so CI writes its own from the
      # committed template. Without it the `@laioutr-*` scopes resolve against the public registry,
      # where none of them exist, and the install fails on the first private dependency.
      - name: Create .npmrc from template
        env:
          NPM_LAIOUTR_TOKEN: ${{ secrets.NPM_LAIOUTR_TOKEN }}
        run: sed "s|NPM_LAIOUTR_TOKEN|${NPM_LAIOUTR_TOKEN}|" .npmrc.config > .npmrc

      - name: Install dependencies
        run: pnpm install

      # tsconfig.json extends ./.nuxt/tsconfig.json, which this generates. Without it the import
      # resolver cannot read any path and every import reports as unresolved.
      - name: Prepare
        run: pnpm run dev:prepare

      - name: Lint
        run: pnpm run lint

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Create .npmrc from template
        env:
          NPM_LAIOUTR_TOKEN: ${{ secrets.NPM_LAIOUTR_TOKEN }}
        run: sed "s|NPM_LAIOUTR_TOKEN|${NPM_LAIOUTR_TOKEN}|" .npmrc.config > .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Playground prepare
        run: pnpm run dev:prepare

      - name: Test
        run: pnpm run test

      # Runs here rather than in its own job so it reuses the prepare above: `test:types` checks the
      # playground too, and that only typechecks once `nuxi prepare` has generated its `.nuxt`.
      - name: Typecheck
        run: pnpm run test:types
